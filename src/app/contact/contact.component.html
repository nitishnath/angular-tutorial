<main class="contact">

  <section class="contact-hero">
    <h1>Contact Us</h1>

    <p>
      Have questions about Angular? Feel free to get in touch.
    </p>
  </section>

  <section class="contact-content">

    <div class="contact-card">

      <h2>Get In Touch</h2>

      <form>

        <div class="form-group">
          <label>Name</label>
          <input type="text" placeholder="Enter your name">
        </div>

        <div class="form-group">
          <label>Email</label>
          <input type="email" placeholder="Enter your email">
        </div>

        <div class="form-group">
          <label>Message</label>
          <textarea placeholder="Enter your message"></textarea>
        </div>

        <button type="submit">
          Send Message
        </button>

      </form>

    </div>

  </section>

</main>
